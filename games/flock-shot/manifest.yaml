id: flock-shot
title: Flock Shot
version: 0.1.0
authors: [ "You" ]
colors: [ "red" ]
max_points_per_color:
  red: 3
description: "Birds burst out of the grass and weave across the sky. Shine the laser on them to shoot; you get three shots per flight."
instructions: |
  Shine the red laser on a bird to shoot it: each new dot is one shot, and you have three
  shots for each flight of birds. Hit enough of the ten birds in a round to go on to the
  next, faster one. Press C to (re)calibrate.
debug_click:
  enabled: true
  buttons:
    left: red
  intensity: 9999
